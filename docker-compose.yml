services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cadpoint_crm
      POSTGRES_USER: cadpoint
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - cadpoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cadpoint -d cadpoint_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cadpoint_pgdata:
