name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cadtest
          POSTGRES_PASSWORD: cadtest
          POSTGRES_DB: cadpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadtest" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: "postgresql://cadtest:cadtest@localhost:5432/cadpoint_test"
      DIRECT_URL: "postgresql://cadtest:cadtest@localhost:5432/cadpoint_test"
      JWT_SECRET: "ci_jwt_secret_test_key_12345"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Prisma generate
        working-directory: server
        run: npx prisma generate

      - name: Push Prisma schema to test DB
        working-directory: server
        run: npx prisma db push --schema=./prisma/schema.prisma

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
