version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cadtest
      POSTGRES_PASSWORD: cadtest
      POSTGRES_DB: cadpoint_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadtest"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_test_data:/var/lib/postgresql/data

volumes:
  db_test_data:
